name: Secret Scan

# Two-part control: scripts/hooks/pre-commit catches the mistake before it becomes
# history, on the developer's machine; this workflow catches contributors without
# hooks, on every push and PR, plus a weekly full-history sweep because detection
# rules are added upstream continuously — a commit clean in March can be a finding
# in June. Ported from konradcinkusz/architecture-standards.
#
# The scanner image is :latest deliberately, against the usual pinning rule: a
# pinned scanner silently stops detecting whatever was added upstream. Everything
# else in this repository is pinned.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          # Load-bearing: a shallow clone would scan only the tip commit, so a secret
          # added and then removed earlier in the same branch would pass, which is
          # exactly the case this job exists to catch.
          fetch-depth: 0

      - name: Scan
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/gitleaks/gitleaks:latest"

          if docker run --rm "$IMAGE" git --help >/dev/null 2>&1; then
            SUB=(git /repo)
          else
            SUB=(detect --source=/repo)
          fi

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            "${SUB[@]}" \
              --config=/repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --verbose \
              --exit-code 1

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Secret scan failed"
            echo
            echo "A credential-shaped string was found in this repository's history."
            echo
            echo "**This repository is public.** A pushed commit is disclosed the moment"
            echo "it is pushed, so the order of operations is not negotiable:"
            echo
            echo "1. **Rotate the credential.** Now, before anything else."
            echo "2. Remove it from the source; read it from the environment instead."
            echo "3. Only then clean history."
            echo
            echo "If this is a false positive, add a **narrow** allowlist entry to"
            echo "\`.gitleaks.toml\` with a comment saying why. Never allowlist a finding"
            echo "by pasting the real value into a regex."
            echo
            echo "Reproduce locally: \`./scripts/scan-secrets.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
