name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore tests/ContextPin.Service.Tests/ContextPin.Service.Tests.csproj

      - name: Build
        run: dotnet build tests/ContextPin.Service.Tests/ContextPin.Service.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ContextPin.Service.Tests/ContextPin.Service.Tests.csproj --configuration Release --no-build --verbosity normal
